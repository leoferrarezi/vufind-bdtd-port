; BDTD: somente o que difere do searches.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../../../config/vufind/searches.ini
; As listas de tipos de busca substituem as do padrão
override_full_sections = "Basic_Searches,Advanced_Searches"

[General]
; Como na produção: até 1.000 resultados paginados; filtros não mantidos entre buscas
result_limit              = 1000
retain_filters_by_default = false

[Basic_Searches]
AllFields = "All Fields"
Title     = Title
year      = adv_search_year
Author    = Author
Subject   = Subject
Abstract  = Abstract

[Advanced_Searches]
AllFields = adv_search_all
Title     = adv_search_title
Author    = adv_search_author
year      = adv_search_year
Subject   = adv_search_subject
Abstract  = Abstract
